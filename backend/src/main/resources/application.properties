quarkus.application.name=taskflow-backend
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000

# Datasource — local Postgres via `docker compose up -d db` at repo root.
# Override with TASKFLOW_DB_URL / TASKFLOW_DB_USER / TASKFLOW_DB_PASSWORD.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${TASKFLOW_DB_URL:jdbc:postgresql://localhost:5432/taskflow}
quarkus.datasource.username=${TASKFLOW_DB_USER:taskflow}
quarkus.datasource.password=${TASKFLOW_DB_PASSWORD:taskflow}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.log.sql=false

# Tests run against a dedicated database on the same compose Postgres.
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/taskflow_test

# JWT — dev keypair generated for local dev; tests use their own.
mp.jwt.verify.publickey.location=classpath:keys/public.pem
mp.jwt.verify.issuer=taskflow
smallrye.jwt.new-token.issuer=taskflow
smallrye.jwt.new-token.lifespan=3600

# Mail — dev defaults to SMTP; mailhog-friendly. Dev mode logs instead when unset.
quarkus.mailer.from=TaskFlow <noreply@taskflow.local>
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.start-tls=DISABLED
%test.quarkus.mailer.mock=true

# Public base URL for links inside emails
app.base-url=http://localhost:8080
